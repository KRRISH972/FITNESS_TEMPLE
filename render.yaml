# Render.com blueprint — Fitness Temple The Gym BACKEND-ONLY (24/7 public API)
# Frontend is hosted on Vercel separately.
# Use: render.com -> New -> Blueprint -> select this repo
# On first deploy, set the secret env vars (GROQ_API_KEY, BREVO_API_KEY).

services:
  - type: web
    name: fitness-temple-api
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: npm install -g pnpm@11.22.0 && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GYM_EMAIL
        value: krrishai0916@gmail.com
      - key: GROQ_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false